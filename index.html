<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保时捷 X431 刷隐藏编码助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--accent:#e8a838;--accent2:#d4922e;--text:#e4e4e7;--text2:#9ca3af;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-tap-highlight-color:transparent}
.container{max-width:1200px;margin:0 auto;padding:20px}
header{text-align:center;padding:30px 0 20px;border-bottom:1px solid var(--border);margin-bottom:30px}
header h1{font-size:28px;color:var(--accent);margin-bottom:8px}
header p{color:var(--text2);font-size:14px}
.car-select{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:end}
.car-select .group{flex:1;min-width:180px}
.car-select label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.car-select select{width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;cursor:pointer;-webkit-appearance:none;appearance:none}
.car-select select:focus{outline:none;border-color:var(--accent)}
.module-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.module-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap}
.module-btn:hover,.module-btn:active{border-color:var(--accent);color:var(--text)}
.module-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.search-box{position:relative;margin-bottom:16px}
.search-box input{width:100%;padding:10px 12px 10px 36px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.search-box input:focus{outline:none;border-color:var(--accent)}
.search-box::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px;max-height:500px;overflow-y:auto;padding:4px;margin-bottom:20px;-webkit-overflow-scrolling:touch}
.items-grid::-webkit-scrollbar{width:6px}
.items-grid::-webkit-scrollbar-track{background:var(--card);border-radius:3px}
.items-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.item-card{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s}
.item-card:hover,.item-card:active{border-color:var(--accent);transform:translateY(-1px)}
.item-card.selected{border-color:var(--accent);background:rgba(232,168,56,.08)}
.item-card input[type=checkbox]{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-info .name{font-size:13px;font-weight:500;margin-bottom:2px}
.item-info .module-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;margin-right:4px;margin-bottom:2px}
.item-info .compat{font-size:11px;color:var(--text2)}
.item-info .steps-count{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;background:var(--accent)22;color:var(--accent);margin-left:4px}
.tag-仪表{background:#3b82f622;color:#60a5fa}.tag-前端{background:#22c55e22;color:#4ade80}.tag-后端{background:#a855f722;color:#c084fc}
.tag-空调{background:#f9731622;color:#fb923c}.tag-DME{background:#ef444422;color:#f87171}.tag-PSM{background:#eab30822;color:#facc15}
.tag-转向{background:#06b6d422;color:#22d3ee}.tag-网关{background:#ec489922;color:#f472b6}.tag-座椅{background:#8b5cf622;color:#a78bfa}
.tag-方向盘{background:#14b8a622;color:#2dd4bf}.tag-摄像头{background:#f43f5e22;color:#fb7185}.tag-大灯{background:#84cc1622;color:#a3e635}
.tag-泊车{background:#0ea5e922;color:#38bdf8}.tag-声浪{background:#d946ef22;color:#e879f9}.tag-跨模块{background:#e8a83822;color:#e8a838}
.output-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-top:24px}
.output-section h2{color:var(--accent);font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.output-section h2 .count{background:var(--accent);color:#000;padding:2px 8px;border-radius:10px;font-size:12px}
.module-group{margin-bottom:20px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.module-group h3{background:var(--border);padding:10px 16px;font-size:14px;display:flex;align-items:center;gap:8px}
.module-group .steps{padding:12px 16px}
.project-block{margin-bottom:16px;padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.project-block .project-title{font-weight:600;font-size:14px;margin-bottom:8px;color:var(--accent)}
.project-block .project-title .en{color:var(--text2);font-weight:400;font-size:12px}
.step{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:none}
.step-num{background:var(--accent);color:#000;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.step-detail{font-size:12px}
.step-detail .path-zh{color:var(--text);margin-bottom:1px;word-break:break-all}
.step-detail .path-en{color:var(--text2);font-size:11px;margin-bottom:3px;word-break:break-all}
.step-detail .val{display:flex;gap:6px;align-items:center;font-size:11px;flex-wrap:wrap}
.step-detail .val .from{color:var(--red);text-decoration:line-through}
.step-detail .val .arrow{color:var(--text2)}
.step-detail .val .to{color:var(--green);font-weight:600}
.step-detail .note{color:var(--accent);font-size:11px;margin-top:2px}
.btn{padding:10px 20px;border-radius:8px;border:none;font-size:14px;cursor:pointer;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover,.btn-primary:active{background:var(--accent2)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover,.btn-outline:active{border-color:var(--accent);color:var(--accent)}
.btn-group{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:700px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;-webkit-overflow-scrolling:touch}
.modal h2{color:var(--accent);margin-bottom:16px;font-size:20px}
.modal h3{color:var(--blue);margin:16px 0 8px;font-size:15px}
.modal p,.modal li{font-size:13px;color:var(--text);margin-bottom:6px}
.modal ol,.modal ul{padding-left:20px}
.modal .close-btn{float:right;background:none;border:none;color:var(--text2);font-size:28px;cursor:pointer;padding:4px 8px}
.modal .close-btn:hover,.modal .close-btn:active{color:var(--text)}
.modal .tip{background:var(--accent)11;border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:12px}
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty .icon{font-size:48px;margin-bottom:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge-ok{background:#22c55e22;color:#4ade80}
.badge-hw{background:#3b82f622;color:#60a5fa}
.badge-multi{background:#e8a83822;color:#e8a838}
.actions-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:16px 0}
.selected-count{font-size:13px;color:var(--text2)}
.selected-count span{color:var(--accent);font-weight:600}
/* ====== 移动端适配 ====== */
@media(max-width:768px){
  .container{padding:12px}
  header{padding:20px 0 16px;margin-bottom:20px}
  header h1{font-size:20px}
  header p{font-size:12px;line-height:1.4}
  .car-select{flex-direction:column;gap:8px;margin-bottom:16px}
  .car-select .group{min-width:100%}
  .car-select label{font-size:11px}
  .car-select select{padding:12px;font-size:15px}
  .module-filter{gap:6px;margin-bottom:12px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .module-filter::-webkit-scrollbar{display:none}
  .module-btn{padding:8px 14px;font-size:12px;flex-shrink:0}
  .search-box input{padding:12px 12px 12px 36px;font-size:15px}
  .items-grid{grid-template-columns:1fr;max-height:400px;gap:8px}
  .item-card{padding:12px;gap:8px}
  .item-card input[type=checkbox]{width:20px;height:20px}
  .item-info .name{font-size:14px}
  .item-info .compat{font-size:12px}
  .actions-bar{flex-direction:column;align-items:stretch;gap:8px}
  .selected-count{text-align:center;font-size:14px}
  .btn-group{flex-direction:column;gap:8px}
  .btn{padding:14px 20px;font-size:15px;text-align:center;width:100%}
  .btn-outline,.btn-primary{width:100%}
  .output-section{padding:16px;margin-top:16px}
  .output-section h2{font-size:16px}
  .module-group h3{padding:10px 12px;font-size:13px;flex-wrap:wrap}
  .module-group .steps{padding:10px 12px}
  .project-block{padding:10px}
  .project-block .project-title{font-size:13px}
  .step{grid-template-columns:32px 1fr;gap:6px;padding:8px 0}
  .step-num{width:28px;height:28px;font-size:12px}
  .step-detail{font-size:13px}
  .step-detail .path-zh{font-size:13px;line-height:1.5}
  .step-detail .path-en{font-size:11px}
  .step-detail .val{font-size:12px}
  .modal-overlay{padding:10px}
  .modal{padding:16px;border-radius:12px;max-height:90vh}
  .modal h2{font-size:18px}
  .modal h3{font-size:14px}
  .modal p,.modal li{font-size:13px}
  .modal .close-btn{font-size:32px;padding:8px}
}
/* 超小屏幕 */
@media(max-width:380px){
  .container{padding:8px}
  header h1{font-size:18px}
  .module-btn{padding:6px 10px;font-size:11px}
  .item-info .name{font-size:13px}
  .step{grid-template-columns:28px 1fr}
}
/* 浮动操作栏（手机端） */
.fab-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:10px 16px;z-index:100;gap:8px}
.fab-bar .fab-count{flex:1;display:flex;align-items:center;font-size:13px;color:var(--text2)}
.fab-bar .fab-count span{color:var(--accent);font-weight:700;font-size:16px;margin:0 4px}
.fab-bar .fab-btn{flex:2;padding:12px;border:none;border-radius:8px;background:var(--accent);color:#000;font-size:15px;font-weight:700;cursor:pointer}
.fab-bar .fab-tutorial{width:44px;height:44px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
body.has-fab{padding-bottom:70px}
@media(max-width:768px){.fab-bar{display:flex}}
.lang-toggle{display:inline-flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;position:absolute;top:16px;right:16px}
.lang-toggle button{padding:6px 16px;border:none;background:var(--card);color:var(--text2);font-size:12px;cursor:pointer;transition:all .2s}
.lang-toggle button.active{background:var(--accent);color:#000;font-weight:600}
header{position:relative}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="lang-toggle"><button class="active" onclick="setLang('zh')">中文</button><button onclick="setLang('en')">EN</button></div>
    <h1 id="titleH1">🏎️ 保时捷 X431 刷隐藏编码助手</h1>
    <p id="titleSub">覆盖 981 / 718 / 991 / Macan · 多步骤项目一键展开 · 跨模块自动分组 · 中英双语</p>
  </header>
  <div class="car-select">
    <div class="group"><label id="lblSeries">车型系列</label><select id="series" onchange="updateModels()"><option value="" id="optSeries">请选择系列</option><option value="718">718 (Boxster/Cayman)</option><option value="981">981 (Boxster/Cayman)</option><option value="991.1">991.1 (Carrera/Turbo/GT3)</option><option value="991.2">991.2 (Carrera/Turbo/GT3)</option><option value="macan">Macan</option></select></div>
    <div class="group"><label id="lblModel">具体型号</label><select id="model"><option value="" id="optModel">请先选择系列</option></select></div>
    <div class="group"><label id="lblYear">年款</label><select id="year"><option value="" id="optYear">请选择年款</option></select></div>
  </div>
  <div class="module-filter" id="moduleFilter"></div>
  <div class="search-box"><input type="text" id="searchInput" placeholder="搜索编码功能名称..." oninput="filterItems()"></div>
  <div class="actions-bar">
    <div class="selected-count" id="lblSelected">已选择 <span id="selectedCount">0</span> 个项目</div>
    <div class="btn-group">
      <button class="btn btn-outline" onclick="selectAll()" id="btnSA">全选当前筛选</button>
      <button class="btn btn-outline" onclick="clearAll()" id="btnCL">清空选择</button>
      <button class="btn btn-primary" onclick="generateOutput()" id="btnGen">📋 生成编码方案</button>
      <button class="btn btn-outline" onclick="showTutorial()" id="btnTut">📖 X431使用教程</button>
    </div>
  </div>
  <div class="items-grid" id="itemsGrid"></div>
  <div class="output-section" id="outputSection" style="display:none">
    <h2 id="lblOutput">📋 编码方案 <span class="count" id="outputCount">0</span></h2>
    <div id="outputContent"></div>
  </div>
</div>
<!-- 浮动操作栏（手机端底部固定） -->
<div class="fab-bar" id="fabBar">
  <div class="fab-count">已选 <span id="fabCount">0</span> 项</div>
  <button class="fab-tutorial" onclick="showTutorial()">📖</button>
  <button class="fab-btn" onclick="generateOutput()" id="fabGen">📋 生成编码方案</button>
</div>

<div class="modal-overlay" id="tutorialModal">
  <div class="modal">
    <button class="close-btn" onclick="closeTutorial()">×</button>
    <div id="tutorialContent"></div>
  </div>
</div>
<script>
// ==================== 数据结构 ====================
// 每个项目(id)对应一个功能，包含 steps[] 数组（多步骤编码）
// multiModule:true = 跨模块项目，筛选时归入"跨模块"分类
// compat = 适用车型系列
const ITEMS = [
  // ====== 组合仪表 - 单模块项目 ======
  {id:1,module:"组合仪表",name:"更改仪表显示车型",nameEn:"Vehicle Variant",compat:["981","718","991.1","991.2","macan"],compatStatus:"ok",note:"改Turbo会导致油箱显示消失",
   steps:[{pathZh:"车载电脑显示配置→车辆变量",pathEn:"Vehicle Variant",from:"Boxster S",to:"自选（GT4/Turbo等）"}]},
  {id:2,module:"组合仪表",name:"显示真实水温",nameEn:"Coolant temperature characteristic curve",compat:["981","718","991.1","991.2","macan"],compatStatus:"ok",note:"",
   steps:[{pathZh:"冷却液温度特性曲线 - 把X值复制到Y值",pathEn:"Coolant temperature characteristic curve - copy X to Y",from:"80-110℃映射为90℃",to:"实际温度"},
    {pathZh:"条柱图设置-冷却液温度条柱图起始",pathEn:"Bargraph settings-coolant temperature bargraph start",from:"60",to:"36"}]},
  {id:3,module:"组合仪表",name:"速度表精确校准",nameEn:"Distance correction characteristic",compat:["718"],compatStatus:"ok",note:"",
   steps:[{pathZh:"距离校正特性-输出特性-Y2~Y8",pathEn:"Distance correction characteristic-Y2~Y8",from:"22/52/103/155/206/256/347",to:"20/50/100/150/200/250/340"}]},
  {id:4,module:"组合仪表",name:"油量四段显示",nameEn:"Oil Level 4 Segments",compat:["718","991.2"],compatStatus:"ok",note:"",
   steps:[{pathZh:"进一步编码-字节0-油位",pathEn:"Further codings-byte 0-Oil Level",from:"1 Segment",to:"4 Segments"}]},
  {id:5,module:"组合仪表",name:"涡轮压力显示范围",nameEn:"Boost Pressure Display",compat:["981","718","991.1","991.2","macan"],compatStatus:"ok",note:"涡轮车",
   steps:[{pathZh:"进一步编码-最大增压压力",pathEn:"Further Codings-Max Boost Pressure",from:"1.10",to:"原厂1.3 / 调校1.6-2.0"},
    {pathZh:"进一步编码-运动增压压力",pathEn:"Further Codings-Sport boost pressure",from:"1.10",to:"同上"}]},
  {id:6,module:"组合仪表",name:"Macan增压压力柱状图激活",nameEn:"Macan Boost Pressure Bar Chart",compat:["macan"],compatStatus:"ok",note:"基础款Macan",
   steps:[{pathZh:"车载电脑菜单配置-字节0-增压压力(柱状图表)=启用",pathEn:"Board computer menu config-byte 0-Boost pressure(bar chart)=enabled",from:"未启用",to:"启用"},
    {pathZh:"设码值-编码字节0-可见图标增压压力=启用",pathEn:"Coding value-Coding byte 0-Visible icon boost pressure=enabled",from:"未启用",to:"启用"},
    {pathZh:"进一步编码2-字节2-增压压力运动响应柱状图表显示=是（后期车型才有）",pathEn:"Further codings 2-byte 2-Boost pressure sport response bar chart=Yes",from:"无/否",to:"是"},
    {pathZh:"进一步编码-最大增压压力",pathEn:"Further Codings-Max boost pressure",from:"1.0",to:"1.3（原厂）/ 1.6-2.0（调校）"},
    {pathZh:"进一步编码-运动增压压力",pathEn:"Further Codings-Sport boost pressure",from:"1.0",to:"同上"}]},
  {id:7,module:"组合仪表",name:"性能/G力显示",nameEn:"Performance Display / G Force",compat:["981","718","991.1","991.2","macan"],compatStatus:"ok",note:"",
   steps:[{pathZh:"车载电脑菜单配置7-性能显示=1",pathEn:"Board computer menu configuration 7-Performance Display=1",from:"0",to:"1"},
    {pathZh:"车载电脑菜单配置字节7-性能显示选择=功率和旋矩",pathEn:"Board computer menu configuration byte 7-Performance display section=Performance Readout+Torque Readout",from:"Torque Display",to:"Performance Readout+Torque Readout"},
    {pathZh:"车载电脑菜单配置字节4-重力=1",pathEn:"Board computer menu configuration byte 4-G force=1",from:"0",to:"1"}]},
  {id:8,module:"组合仪表",name:"换挡辅助显示",nameEn:"Upshift Display / Gear Shift Assist",compat:["981","718","991.1","991.2","macan"],compatStatus:"ok",note:"981需额外调优数据",
   steps:[{pathZh:"车载电脑菜单配置字节7-升档显示=1",pathEn:"Board computer menu configuration byte 7-Upshift Display=1",from:"0",to:"1"}]},
  {id:9,module:"组合仪表",name:"滑行显示图标",nameEn:"Sailing display",compat:["718","991.2"],compatStatus:"ok",note:"",
   steps:[{pathZh:"设码值-编码字节1-航行显示=1",pathEn:"Coding value-Coding byte 1-Sailing display=1",from:"0",to:"1"},
    {pathZh:"设码值-编码字节1-航行显示in MAP=1",pathEn:"Coding value-Coding byte 1-Sailing display in MAP=1",from:"0",to:"1"}]},
  {id:10,module:"组合仪表",name:"中性档显示(N档图标)",nameEn:"N Display activated",compat:["718","991.2"],compatStatus:"ok",note:"718/991.2独有",
   steps:[{pathZh:"进一步编码2-字节20-N显示激活=yes",pathEn:"Further codings byte 20-N Display activated=yes",from:"no",to:"yes"}]},
  {id:11,module:"组合仪表",name:"日行灯菜单",nameEn:"Daytime running light menu",compat:["981","718","991.1","991.2","macan"],compatStatus:"ok",note:"需配合前端电子DDL specification=No",
   steps:[{pathZh:"车载电脑菜单配置字节1-日间行车灯=1",pathEn:"Board computer menu config byte 1-Daytime running light=1",from:"0",to:"1"}]},
  {id:12,module:"组合仪表",name:"自动雨刮菜单",nameEn:"Rain sensor menu",compat:["981","718","991.1","991.2","macan"],compatStatus:"ok",note:"",
   steps:[{pathZh:"车载电脑菜单配置字节1-雨量传感器=1",pathEn:"Board computer menu config byte 1-Rain sensor=1",from:"0",to:"1"}]},

// Sort steps by module so same-module steps are grouped together, preserving original order within each module
function sortStepsByModule(steps){const order=[];const seen=new Set();steps.forEach(s=>{const m=s.module||'';if(!seen.has(m)){seen.add(m);order.push(m)}});return[...steps].sort((a,b)=>{const ai=order.indexOf(a.module||'');const bi=order.indexOf(b.module||'');return ai-bi})}
